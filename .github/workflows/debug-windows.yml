# TEMPORARY: reproduce the v0.2.3 Windows release hang (tauri build prints
# nothing for 6 h). Same step as release.yml minus the release. Delete after.
name: Debug Windows tauri build
on:
  push:
    branches: ['debug/windows-tauri-hang']
permissions:
  contents: write
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        signing: [with-key]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Same cache as the release job ("build" job id → shared-key build).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: build
          save-if: false
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.signing == 'with-key' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.signing == 'with-key' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          YON_DEFAULT_RELAY: ${{ vars.YON_DEFAULT_RELAY }}
        with:
          tauriScript: bun tauri
          args: --bundles nsis
          uploadUpdaterJson: false
          releaseName: Yon probe
          releaseBody: |
            ## Download
            `curl -fsSL https://example.invalid/install.sh | bash`
          releaseDraft: true
          prerelease: false
