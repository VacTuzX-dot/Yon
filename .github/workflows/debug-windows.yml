# TEMPORARY: does the real (rendered) v0.2.3 releaseBody, passed to the
# action as INPUT_RELEASEBODY, make `bun tauri build` hang on Windows?
# No tagName: builds only. Delete after.
name: Debug Windows tauri build
on:
  push:
    branches: ['debug/windows-tauri-hang']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        body: [real, ascii]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v0.2.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: matrix.body == 'real'
        timeout-minutes: 15
        with:
          tauriScript: bun tauri
          args: --no-bundle
          releaseBody: |
            ## Download

            | Your computer | File |
            |---|---|
            | **Mac with Apple Silicon** (M1, M2, M3, M4 or newer) | [Yon_0.2.3_aarch64.dmg](https://github.com/VacTuzX-dot/Yon/releases/download/v0.2.3/Yon_0.2.3_aarch64.dmg) |
            | **Mac with an Intel processor** | [Yon_0.2.3_x64.dmg](https://github.com/VacTuzX-dot/Yon/releases/download/v0.2.3/Yon_0.2.3_x64.dmg) |
            | **Windows 10 / 11, 64-bit** (x64, Intel or AMD) | [Yon_0.2.3_x64-setup.exe](https://github.com/VacTuzX-dot/Yon/releases/download/v0.2.3/Yon_0.2.3_x64-setup.exe) |
            | **Windows 11 on ARM** (Snapdragon, e.g. Copilot+ PCs) | [Yon_0.2.3_arm64-setup.exe](https://github.com/VacTuzX-dot/Yon/releases/download/v0.2.3/Yon_0.2.3_arm64-setup.exe) |

            Not sure which one?
            - **Mac:** Apple menu → About This Mac. "Chip: Apple M…" means Apple Silicon; "Processor: … Intel …" means Intel.
            - **Windows:** Settings → System → About → System type. "x64-based processor" → x64; "ARM-based processor" → ARM. 32-bit Windows (x86) isn't supported.

            **Mac without the "Open Anyway" step:** `curl -fsSL https://raw.githubusercontent.com/VacTuzX-dot/Yon/main/install.sh | bash`

            Unsigned build: see the [README](https://github.com/VacTuzX-dot/Yon#install) for the first-open steps. Changes and known problems: [CHANGELOG](https://github.com/VacTuzX-dot/Yon/blob/main/CHANGELOG.md).

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: matrix.body == 'ascii'
        timeout-minutes: 15
        with:
          tauriScript: bun tauri
          args: --no-bundle
          releaseBody: plain ascii body
