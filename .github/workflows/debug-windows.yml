# TEMPORARY: reproduce the v0.2.3 Windows release hang (tauri build prints
# nothing for 6 h). Delete this branch once found.
name: Debug Windows tauri build
on:
  push:
    branches: ['debug/windows-tauri-hang']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - name: tauri --version
        timeout-minutes: 3
        run: bun tauri --version
      - name: tauri info
        timeout-minutes: 5
        run: bun tauri info
      - name: tauri build (verbose, unsigned, no bundle)
        timeout-minutes: 20
        shell: bash
        run: bun tauri build --no-bundle -vv 2>&1 | head -200
