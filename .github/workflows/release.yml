name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Fail fast if the tag and the app version disagree (e.g. tag v0.2.0 but
  # tauri.conf.json still says 0.1.0) — otherwise installers get the wrong name.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches app version
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ]
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Updater public key is set
        shell: bash
        # A release without it could never update itself again.
        run: test -n "$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)"

  # Same checks as every push (fmt, clippy, tests…) on this exact tag.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    # Only this job may write, and only to create the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update archives; the app only installs updates signed
          # with this key (public half in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Built-in relay for "Reach from anywhere" (settings.rs
          # default_relay); empty until the maintainer sets the variable.
          YON_DEFAULT_RELAY: ${{ vars.YON_DEFAULT_RELAY }}
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Yon ${{ github.ref_name }}
          # WHY: direct links per platform so nobody has to guess between
          # the .dmg, .exe, .tar.gz and .sig files in the asset list.
          releaseBody: |
            ## Download

            | Your computer | File |
            |---|---|
            | **Mac with Apple Silicon** (M1, M2, M3, M4 or newer) | [Yon_${{ needs.version.outputs.version }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yon_${{ needs.version.outputs.version }}_aarch64.dmg) |
            | **Windows 10 / 11, 64-bit** (x64, Intel or AMD) | [Yon_${{ needs.version.outputs.version }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yon_${{ needs.version.outputs.version }}_x64-setup.exe) |

            Not sure which one?
            - **Mac:** Apple menu → About This Mac. "Chip: Apple M…" means Apple Silicon. Macs with an Intel processor aren't supported yet.
            - **Windows:** Settings → System → About → System type. "64-bit operating system, x64-based processor" is the right one. 32-bit Windows (x86) isn't supported. On Windows on ARM the x64 installer runs through Windows' emulation (not tested).

            **Mac without the "Open Anyway" step:** `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash`

            Unsigned build: see the [README](https://github.com/${{ github.repository }}#install) for the first-open steps. Changes and known problems: [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # SHA256SUMS.txt computed from the exact files attached to the release.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
    steps:
      - name: Download assets, hash, upload SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            -q '.[] | select(.name != "SHA256SUMS.txt") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" > "$name"
          done
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
            --input ../SHA256SUMS.txt > /dev/null
