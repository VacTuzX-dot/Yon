name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Fail fast if the tag and the app version disagree (e.g. tag v0.2.0 but
  # tauri.conf.json still says 0.1.0) — otherwise installers get the wrong name.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches app version
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ]
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Updater public key is set
        shell: bash
        # A release without it could never update itself again.
        run: test -n "$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)"

  # Same checks as every push (fmt, clippy, tests…) on this exact tag.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    # Only this job may write, and only to create the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          # Intel Macs, cross-compiled on the Apple Silicon runner.
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: ''
            args: --bundles nsis
          # Windows on ARM, cross-compiled on the x64 runner.
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update archives; the app only installs updates signed
          # with this key (public half in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Built-in relay for "Reach from anywhere" (settings.rs
          # default_relay); empty until the maintainer sets the variable.
          YON_DEFAULT_RELAY: ${{ vars.YON_DEFAULT_RELAY }}
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Yon ${{ github.ref_name }}
          # WHY: direct links per platform so nobody has to guess between
          # the .dmg, .exe, .tar.gz and .sig files in the asset list.
          releaseBody: |
            ## Download

            | Your computer | File |
            |---|---|
            | **Mac with Apple Silicon** (M1, M2, M3, M4 or newer) | [Yon_${{ needs.version.outputs.version }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yon_${{ needs.version.outputs.version }}_aarch64.dmg) |
            | **Mac with an Intel processor** | [Yon_${{ needs.version.outputs.version }}_x64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yon_${{ needs.version.outputs.version }}_x64.dmg) |
            | **Windows 10 / 11, 64-bit** (x64, Intel or AMD) | [Yon_${{ needs.version.outputs.version }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yon_${{ needs.version.outputs.version }}_x64-setup.exe) |
            | **Windows 11 on ARM** (Snapdragon, e.g. Copilot+ PCs) | [Yon_${{ needs.version.outputs.version }}_arm64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Yon_${{ needs.version.outputs.version }}_arm64-setup.exe) |

            Not sure which one?
            - **Mac:** Apple menu → About This Mac. "Chip: Apple M…" means Apple Silicon; "Processor: … Intel …" means Intel.
            - **Windows:** Settings → System → About → System type. "x64-based processor" → x64; "ARM-based processor" → ARM. 32-bit Windows (x86) isn't supported.

            **Mac without the "Open Anyway" step:** `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash`

            Unsigned build: see the [README](https://github.com/${{ github.repository }}#install) for the first-open steps. Changes and known problems: [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # WHY: four parallel jobs each rewriting latest.json race and can
          # drop platforms; the checksums job writes it once from the .sig files.
          uploadUpdaterJson: false

  # latest.json (updater manifest) and SHA256SUMS.txt, computed once from the
  # exact files attached to the release, after every build has finished.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
    steps:
      - name: Download assets, write latest.json, hash, upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            -q '.[] | select(.name != "SHA256SUMS.txt" and .name != "latest.json") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" > "$name"
          done

          # One updater entry per platform, keyed the way tauri-plugin-updater
          # looks them up ("<os>-<arch>-<installer>", then "<os>-<arch>").
          platforms='{}'
          for sig in *.sig; do
            case "$sig" in
              *_aarch64.app.tar.gz.sig | *_arm64.app.tar.gz.sig) keys="darwin-aarch64 darwin-aarch64-app" ;;
              *_x64.app.tar.gz.sig | *_x86_64.app.tar.gz.sig) keys="darwin-x86_64 darwin-x86_64-app" ;;
              *_x64-setup.exe.sig | *_x86_64-setup.exe.sig) keys="windows-x86_64 windows-x86_64-nsis" ;;
              *_arm64-setup.exe.sig | *_aarch64-setup.exe.sig) keys="windows-aarch64 windows-aarch64-nsis" ;;
              *) echo "::error::no updater platform for $sig"; exit 1 ;;
            esac
            url="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/${sig%.sig}"
            for key in $keys; do
              platforms=$(jq --arg k "$key" --arg s "$(cat "$sig")" --arg u "$url" \
                '.[$k] = {signature: $s, url: $u}' <<<"$platforms")
            done
          done
          for need in darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64; do
            jq -e --arg k "$need" 'has($k)' <<<"$platforms" > /dev/null \
              || { echo "::error::latest.json is missing $need"; exit 1; }
          done
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg n "https://github.com/$REPO/releases/tag/$GITHUB_REF_NAME" \
            --argjson p "$platforms" '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          gh api --method POST -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            --input latest.json > /dev/null

          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
            --input ../SHA256SUMS.txt > /dev/null
