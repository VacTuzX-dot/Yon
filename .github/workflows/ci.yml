name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release runs this same gate on the tagged revision before building.
  workflow_call:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); comment = version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (no dangerouslySetInnerHTML)
        run: bun run lint

      - name: JS tests (Yon Link crypto vectors)
        run: bun run test

      # tauri::generate_context! needs the built frontend (frontendDist) to exist.
      - name: Build frontend
        run: bun run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # The release also builds for Intel Macs and Windows on ARM; make sure the
  # code (and C dependencies like ring) still compile for them before a tag.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      # check, not build: build scripts (C code) still compile for the
      # target, without the release profile's slow LTO link.
      - name: cargo check (${{ matrix.target }})
        working-directory: src-tauri
        run: cargo check --target ${{ matrix.target }}

  # Known vulnerabilities in Rust and JS dependencies (RustSec / npm advisories).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: bun audit
        run: bun audit

      # install.sh runs under macOS's /bin/bash 3.2, which misreads a
      # multibyte character after "$var" in a UTF-8 locale.
      - name: install.sh is ASCII and parses
        run: |
          ! LC_ALL=C grep -n '[^[:print:][:space:]]' install.sh
          bash -n install.sh

      # install.ps1 is read as ANSI by Windows PowerShell 5.1 when it has no
      # BOM, so it stays ASCII. pwsh is preinstalled on the runner.
      - name: install.ps1 is ASCII and parses
        shell: pwsh
        run: |
          if (Select-String -Path install.ps1 -Pattern '[^\x09\x0A\x0D\x20-\x7E]') { throw "install.ps1 has non-ASCII characters" }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
