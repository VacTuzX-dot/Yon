name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release runs this same gate on the tagged revision before building.
  workflow_call:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); comment = version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (no dangerouslySetInnerHTML)
        run: bun run lint

      - name: JS tests (Yon Link crypto vectors)
        run: bun run test

      # tauri::generate_context! needs the built frontend (frontendDist) to exist.
      - name: Build frontend
        run: bun run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # The release also builds for Intel Macs and Windows on ARM; make sure the
  # code (and C dependencies like ring) still compile for them before a tag.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      # check, not build: build scripts (C code) still compile for the
      # target, without the release profile's slow LTO link.
      - name: cargo check (${{ matrix.target }})
        working-directory: src-tauri
        run: cargo check --target ${{ matrix.target }}

  # Known vulnerabilities in Rust and JS dependencies (RustSec / npm advisories).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: bun audit
        run: bun audit

      # install.sh runs under macOS's /bin/bash 3.2, which misreads a
      # multibyte character after "$var" in a UTF-8 locale.
      - name: install.sh is ASCII and parses
        run: |
          ! LC_ALL=C grep -n '[^[:print:][:space:]]' install.sh
          bash -n install.sh

      # install.ps1 is read as ANSI by Windows PowerShell 5.1 when it has no
      # BOM, so it stays ASCII. pwsh is preinstalled on the runner.
      - name: install.ps1 is ASCII and parses
        shell: pwsh
        run: |
          if (Select-String -Path install.ps1 -Pattern '[^\x09\x0A\x0D\x20-\x7E]') { throw "install.ps1 has non-ASCII characters" }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  # Tests relay and website inside the image they ship in, not on the runner.
  # WHY: the base image comes from each Dockerfile, so a Dependabot bump of
  # `FROM oven/bun:…` is tested before merge instead of trusting Bun 1.3.0.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [relay, website]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WHY: the FROM value is later interpolated into docker commands, so it
      # must match a strict pattern first. SERVICE is only ever relay or website.
      - name: Read and validate the base image
        run: |
          image="$(awk 'toupper($1)=="FROM"{print $2; exit}' "$SERVICE/Dockerfile")"
          [[ "$image" =~ ^oven/bun:[0-9]+(\.[0-9]+)*-alpine$ ]] || { echo "Unexpected base image for $SERVICE: $image"; exit 1; }
          case "$SERVICE" in
            relay) port=8787 ;;
            website) port=8788 ;;
            *) echo "Unknown service: $SERVICE"; exit 1 ;;
          esac
          {
            echo "BASE_IMAGE=$image"
            echo "SERVICE_PORT=$port"
          } >> "$GITHUB_ENV"
          echo "Base image: $image, port: $port"

      # WHY: tests use os.tmpdir() only, so a read-only mount with a tmpfs /tmp is enough.
      # WHY: HOME points at the tmpfs so Bun's cache (~/.bun) has somewhere to go; /root is on the read-only root.
      - name: Unit tests in the base image
        run: |
          docker run --rm --read-only --tmpfs /tmp -e HOME=/tmp -v "$PWD:/w:ro" -w /w "$BASE_IMAGE" bun test "$SERVICE/"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.service == 'website'
        with:
          bun-version: 1.3.0

      - name: Build the site
        if: matrix.service == 'website'
        run: |
          bun install --frozen-lockfile
          bun run build:link

      # WHY: the same context website.yml uploads, so the image is built the same way as in production.
      - name: Build the image
        run: |
          if [ "$SERVICE" = website ]; then
            ctx="$RUNNER_TEMP/ctx"
            mkdir -p "$ctx"
            cp website/serve.ts website/Dockerfile "$ctx/"
            cp -R site "$ctx/public"
          else
            ctx="relay"
          fi
          docker build -t "yon-$SERVICE:ci" "$ctx"

      # WHY: same hardening flags as production, so a test that passes here cannot rely on a writable root or extra capabilities.
      - name: Start the container
        run: |
          docker run -d --name "yon-$SERVICE-ci" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p "127.0.0.1:$SERVICE_PORT:$SERVICE_PORT" \
            "yon-$SERVICE:ci"

      - name: Wait for it to answer
        run: |
          path=/
          [ "$SERVICE" = website ] && path=/healthz
          url="http://127.0.0.1:$SERVICE_PORT$path"
          status=000
          for _ in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
            # WHY: relay answers / with 404 or 426, so any HTTP status means it is up.
            if [ "$SERVICE" = relay ] && [ "$status" != 000 ]; then break; fi
            if [ "$status" = 200 ]; then break; fi
            sleep 1
          done
          # WHY: explicit if, not $(... && echo y) — under bash -e a failed command substitution in an assignment would exit silently.
          up=no
          if [ "$SERVICE" = relay ] && [ "$status" != 000 ]; then up=yes; fi
          if [ "$SERVICE" = website ] && [ "$status" = 200 ]; then up=yes; fi
          [ "$up" = yes ] || { echo "$SERVICE did not answer at $url (HTTP $status)"; exit 1; }
          echo "$SERVICE answers (HTTP $status)"

      # The same WebSocket check deploy.sh runs (relay/check.ts, ws:// is allowed for a local run).
      - name: Smoke check, relay
        if: matrix.service == 'relay'
        run: |
          docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true "yon-relay:ci" bun check.ts ws://127.0.0.1:8787

      # Same header checks as website/deploy.sh.
      - name: Smoke check, website
        if: matrix.service == 'website'
        run: |
          base="http://127.0.0.1:8788"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/healthz")" = 200 ] || { echo "/healthz is not 200"; exit 1; }
          phone="$(curl -sS -D - -o /dev/null "$base/phonelink/" | tr -d '\r')"
          printf '%s\n' "$phone" | head -n 1 | grep -q ' 200' || { echo "/phonelink/ is not 200"; exit 1; }
          printf '%s\n' "$phone" | grep -iq '^content-security-policy:.*connect-src wss:' || { echo "/phonelink/ CSP lacks connect-src wss:"; exit 1; }
          printf '%s\n' "$phone" | grep -iq '^permissions-policy:.*camera=(self)' || { echo "/phonelink/ lacks camera=(self)"; exit 1; }
          home="$(curl -sS -D - -o /dev/null "$base/" | tr -d '\r')"
          printf '%s\n' "$home" | grep -iq '^permissions-policy:.*camera=()' || { echo "/ lacks camera=()"; exit 1; }
          echo "Website headers OK"

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs "yon-$SERVICE-ci" || true
          docker rm -f "yon-$SERVICE-ci" || true
