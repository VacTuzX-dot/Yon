[package]
name = "yon"
version = "0.2.3"
description = "Toss files to nearby devices"
authors = ["VacTuzX-dot"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
gethostname = "1.1.0"
mdns-sd = "0.21"
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = "0.14"
webpki = { version = "0.103.15", package = "rustls-webpki", default-features = false, features = ["alloc", "ring"] }
httparse = "1"
qrcode = { version = "0.14.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
rustls-platform-verifier = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13.0"
